<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Pet</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      .pet {
        width: 180px;
        height: 180px;
        position: absolute;
        left: 30px;
        top: 28px;
        display: grid;
        place-items: center;
        font-size: 96px;
        animation: idle 1.6s ease-in-out infinite;
        cursor: grab;
        touch-action: none;
      }

      .pet.dragging {
        cursor: grabbing;
      }

      .pet-image,
      .pet iframe {
        max-width: 100%;
        max-height: 100%;
        pointer-events: none;
      }

      .external-pet {
        width: 100%;
        pointer-events: none;
      }

      .click-panel {
        position: absolute;
        z-index: 5;
        left: 18px;
        top: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
      }

      .bubble {
        max-width: 206px;
        padding: 7px 10px;
        border-radius: 8px;
        background: white;
        color: #222;
        font: 13px/1.3 system-ui, sans-serif;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
        opacity: 0;
        transform: translateY(4px);
        transition: 160ms ease;
        white-space: pre-line;
      }

      .bubble.show {
        opacity: 1;
        transform: translateY(0);
      }

      .action-menu {
        position: absolute;
        z-index: 6;
        left: 18px;
        top: 168px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        opacity: 0;
        transform: translateY(-4px);
        transition: 160ms ease;
        pointer-events: none;
      }

      .action-menu.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .action-bubble {
        max-width: 206px;
        padding: 7px 10px;
        border: none;
        border-radius: 8px;
        background: white;
        color: #222;
        font: 13px/1.3 system-ui, sans-serif;
        text-align: left;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
        cursor: pointer;
      }

      .action-bubble:hover {
        background: #f2f2f2;
      }

      .settings-title {
        font-size: 15px;
        font-weight: 700;
      }

      .close-button,
      .settings-button {
        border: 1px solid #d0d5dd;
        border-radius: 7px;
        background: #fff;
        color: #202124;
        font: inherit;
        cursor: pointer;
      }

      .close-button {
        width: 28px;
        height: 28px;
      }

      .settings-help {
        color: #5f6368;
        font-size: 12px;
      }

      .settings-button {
        padding: 7px 10px;
      }

      .settings-button.primary {
        background: #202124;
        border-color: #202124;
        color: #fff;
      }

      .settings-button.danger {
        color: #b42318;
      }

      .today-widget {
        position: absolute;
        inset: 12px;
        display: none;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.97);
        color: #202124;
        font: 13px/1.35 system-ui, sans-serif;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      }

      .today-widget.open {
        display: flex;
      }

      .widget-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .today-widget-list {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow: auto;
        border-top: 1px solid #eaecf0;
        border-bottom: 1px solid #eaecf0;
        padding: 8px 0;
      }

      .today-widget-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 6px;
        align-items: center;
      }

      .today-widget-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .widget-add-row {
        display: flex;
        gap: 6px;
      }

      .widget-add-row input {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid #d0d5dd;
        border-radius: 7px;
        font: inherit;
      }

      @keyframes idle {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
    </style>
  </head>
  <body>
    <div id="clickPanel" class="click-panel">
      <div id="bubble" class="bubble">안녕!</div>
    </div>
    <div id="actionMenu" class="action-menu">
      <button id="actionCapture" class="action-bubble" type="button">🖼️ 화면 캡처 AI 도움</button>
      <button id="actionChat" class="action-bubble" type="button">💬 AI와 대화</button>
    </div>
    <div id="pet" class="pet" title="drag or click"></div>

    <section id="todayWidget" class="today-widget" aria-hidden="true">
      <div class="widget-header">
        <div class="settings-title">오늘 할 일</div>
        <button id="closeTodayWidget" class="close-button" type="button">X</button>
      </div>
      <div id="todayWidgetList" class="today-widget-list"></div>
      <div class="widget-add-row">
        <input id="todayWidgetInput" type="text" placeholder="새 할일 추가" />
        <button id="todayWidgetAdd" class="settings-button primary" type="button">추가</button>
      </div>
      <div class="settings-help">마우스 휠 클릭으로 언제든 다시 열 수 있어요.</div>
    </section>

    <script type="text/javascript" async src="https://tenor.com/embed.js"></script>

    <script>
      const pet = document.getElementById("pet");
      const bubble = document.getElementById("bubble");
      const actionMenu = document.getElementById("actionMenu");
      const actionCapture = document.getElementById("actionCapture");
      const actionChat = document.getElementById("actionChat");
      const todayWidget = document.getElementById("todayWidget");
      const closeTodayWidgetButton = document.getElementById("closeTodayWidget");
      const todayWidgetList = document.getElementById("todayWidgetList");
      const todayWidgetInput = document.getElementById("todayWidgetInput");
      const todayWidgetAdd = document.getElementById("todayWidgetAdd");

      let pointerDown = false;
      let dragged = false;
      let startX = 0;
      let startY = 0;
      let firedAlarmKeys = new Set();
      let schedule = [];
      let settings = {
        bubbleDurationMs: 1200,
        alarmDurationMs: 6000,
        pet: { type: "emoji", emoji: "🙂", image: "pet.gif", externalHtmlFile: "external-pet.html" },
        ai: { enabled: false, apiKey: "", endpoint: "https://api.openai.com/v1/chat/completions", model: "gpt-4o-mini" },
        sync: { enabled: false, apiUrl: "", apiToken: "" },
        alarms: []
      };

      function localDate() {
        const now = new Date();
        return [now.getFullYear(), String(now.getMonth() + 1).padStart(2, "0"), String(now.getDate()).padStart(2, "0")].join("-");
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function showBubbleMessage(message = "안녕!", duration = settings.bubbleDurationMs) {
        bubble.innerHTML = message;
        bubble.classList.add("show");
        window.clearTimeout(window.hideBubbleTimer);
        window.hideBubbleTimer = window.setTimeout(() => bubble.classList.remove("show"), duration);
      }

      function closeActionMenu() {
        actionMenu.classList.remove("show");
        window.clearTimeout(window.hideActionMenuTimer);
      }

      function openActionMenu(duration = settings.alarmDurationMs) {
        actionMenu.classList.add("show");
        window.clearTimeout(window.hideActionMenuTimer);
        window.hideActionMenuTimer = window.setTimeout(() => actionMenu.classList.remove("show"), duration);
      }

      async function renderPet() {
        pet.innerHTML = "";

        if (settings.pet.type === "image") {
          const image = document.createElement("img");
          image.className = "pet-image";
          image.src = settings.pet.image || "pet.gif";
          image.alt = "pet";
          pet.appendChild(image);
          return;
        }

        if (settings.pet.type === "external") {
          const wrapper = document.createElement("div");
          wrapper.className = "external-pet";
          wrapper.innerHTML = await window.desktopPet.readExternalHtml(settings.pet.externalHtmlFile);
          pet.appendChild(wrapper);
          if (window.tenorEmbed) window.tenorEmbed();
          return;
        }

        const emoji = document.createElement("span");
        emoji.className = "emoji-pet";
        emoji.textContent = settings.pet.emoji || "🙂";
        pet.appendChild(emoji);
      }

      function todayScheduleItems() {
        const today = localDate();
        const nowTime = new Date().toTimeString().slice(0, 5);
        return schedule
          .filter((item) => item.date === today)
          .filter((item) => item.done || !item.time || item.time >= nowTime)
          .sort((a, b) => {
            if (Boolean(a.done) !== Boolean(b.done)) {
              return a.done ? 1 : -1;
            }
            return `${a.time || "99:99"}`.localeCompare(`${b.time || "99:99"}`);
          });
      }

      function allTodayItems() {
        const today = localDate();
        return schedule
          .filter((item) => item.date === today)
          .sort((a, b) => `${a.time || "99:99"}`.localeCompare(`${b.time || "99:99"}`));
      }

      function renderTodayWidget() {
        todayWidgetList.innerHTML = "";
        const items = allTodayItems();

        if (!items.length) {
          const hint = document.createElement("div");
          hint.className = "settings-help";
          hint.textContent = "오늘 등록된 할일이 없습니다.";
          todayWidgetList.appendChild(hint);
          return;
        }

        for (const item of items) {
          const row = document.createElement("div");
          row.className = "today-widget-item";

          const done = document.createElement("input");
          done.type = "checkbox";
          done.checked = Boolean(item.done);
          done.addEventListener("change", async () => {
            item.done = done.checked;
            label.style.textDecoration = done.checked ? "line-through" : "none";
            await window.desktopPet.updateSchedule({ id: item.id, done: done.checked });
          });

          const label = document.createElement("span");
          label.textContent = `${item.time ? `${item.time} ` : ""}${item.title}`;
          label.style.cursor = "pointer";
          if (item.done) {
            label.style.textDecoration = "line-through";
          }
          label.addEventListener("click", () => {
            done.checked = !done.checked;
            done.dispatchEvent(new Event("change"));
          });

          const remove = document.createElement("button");
          remove.className = "settings-button danger";
          remove.type = "button";
          remove.textContent = "삭제";
          remove.addEventListener("click", async () => {
            await window.desktopPet.deleteSchedule(item.id);
          });

          row.appendChild(done);
          row.appendChild(label);
          row.appendChild(remove);
          todayWidgetList.appendChild(row);
        }
      }

      function openTodayWidgetPanel() {
        closeActionMenu();
        renderTodayWidget();
        todayWidget.classList.add("open");
        todayWidget.setAttribute("aria-hidden", "false");
      }

      function closeTodayWidgetPanel() {
        todayWidget.classList.remove("open");
        todayWidget.setAttribute("aria-hidden", "true");
        window.desktopPet.closeTodayWidget();
      }

      function summarizeTodaySchedule() {
        const items = todayScheduleItems();
        if (!items.length) {
          return "오늘 남은 할 일이 없어요.";
        }

        return items
          .map((item) => {
            const line = `${item.time ? `${item.time} ` : ""}${escapeHtml(item.title)}`;
            return item.done ? `<s>${line}</s>` : line;
          })
          .join("\n");
      }

      function checkAlarms() {
        const now = new Date();
        const date = localDate();
        const time = now.toTimeString().slice(0, 5);

        for (const alarm of settings.alarms || []) {
          const alarmKey = `fixed ${date} ${alarm.time}`;
          if (alarm.time === time && !firedAlarmKeys.has(alarmKey)) {
            firedAlarmKeys.add(alarmKey);
            showBubbleMessage(escapeHtml(alarm.message), settings.alarmDurationMs);
            return;
          }
        }

        for (const item of schedule) {
          if (item.done || !item.time || item.date !== date || item.time !== time) {
            continue;
          }

          const itemKey = `todo ${item.id} ${date} ${item.time}`;
          if (firedAlarmKeys.has(itemKey)) {
            continue;
          }

          firedAlarmKeys.add(itemKey);
          showBubbleMessage(`${escapeHtml(item.title)}${item.memo ? `\n${escapeHtml(item.memo)}` : ""}`, settings.alarmDurationMs);
          return;
        }
      }

      async function applySettings(nextSettings) {
        settings = {
          ...settings,
          ...nextSettings,
          pet: { ...settings.pet, ...(nextSettings.pet || {}) },
          ai: { ...settings.ai, ...(nextSettings.ai || {}) },
          sync: { ...settings.sync, ...(nextSettings.sync || {}) }
        };
        await renderPet();
      }

      function applySchedule(nextSchedule) {
        schedule = Array.isArray(nextSchedule) ? nextSchedule : [];
        if (todayWidget.classList.contains("open")) {
          renderTodayWidget();
        }
      }

      window.desktopPet.readSettings().then(applySettings);
      window.desktopPet.readSchedule().then(applySchedule);
      window.desktopPet.onSettingsUpdated(applySettings);
      window.desktopPet.onScheduleUpdated(applySchedule);
      window.desktopPet.onTodayWidgetOpen(openTodayWidgetPanel);
      window.desktopPet.onUpdateReady(() => {
        showBubbleMessage("업데이트가 준비됐어요. 우클릭 > 재시작을 누르면 바로 적용됩니다.", settings.alarmDurationMs);
      });
      window.setInterval(checkAlarms, 1000);

      closeTodayWidgetButton.addEventListener("click", closeTodayWidgetPanel);

      async function submitTodayWidgetAdd() {
        const title = todayWidgetInput.value.trim();
        if (!title) {
          return;
        }
        await window.desktopPet.addSchedule({ date: localDate(), time: "", title, memo: "" });
        todayWidgetInput.value = "";
        renderTodayWidget();
      }

      todayWidgetAdd.addEventListener("click", submitTodayWidgetAdd);
      todayWidgetInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          submitTodayWidgetAdd();
        }
      });

      pet.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;

        pointerDown = true;
        dragged = false;
        startX = event.screenX;
        startY = event.screenY;
        pet.classList.add("dragging");
        pet.setPointerCapture(event.pointerId);
        window.desktopPet.startDrag({ x: event.screenX, y: event.screenY });
      });

      pet.addEventListener("pointermove", (event) => {
        if (!pointerDown) return;

        const distance = Math.hypot(event.screenX - startX, event.screenY - startY);
        if (distance > 3) dragged = true;
        window.desktopPet.moveDrag({ x: event.screenX, y: event.screenY });
      });

      pet.addEventListener("pointerup", (event) => {
        if (event.button !== 0) return;

        pointerDown = false;
        pet.classList.remove("dragging");
        window.desktopPet.endDrag();

        if (!dragged) {
          showBubbleMessage(summarizeTodaySchedule(), settings.alarmDurationMs);
          openActionMenu(settings.alarmDurationMs);
        }
      });

      actionCapture.addEventListener("click", async () => {
        closeActionMenu();
        showBubbleMessage("화면을 분석하고 있어요...", 30000);

        try {
          const { reply } = await window.desktopPet.captureScreenHelp();
          showBubbleMessage(escapeHtml(reply || "분석 결과가 없어요."), settings.alarmDurationMs);
        } catch (error) {
          showBubbleMessage(`캡처 도움 실패: ${escapeHtml(error.message || "AI 설정을 확인해 주세요.")}`, settings.alarmDurationMs);
        }
      });

      actionChat.addEventListener("click", () => {
        closeActionMenu();
        window.desktopPet.openAiChat();
      });

      document.body.addEventListener("click", (event) => {
        if (
          event.target.closest("#pet") ||
          event.target.closest(".action-bubble") ||
          event.target.closest(".today-widget")
        ) {
          return;
        }

        showBubbleMessage(summarizeTodaySchedule(), settings.alarmDurationMs);
        openActionMenu(settings.alarmDurationMs);
      });

      pet.addEventListener("mousedown", (event) => {
        if (event.button === 1) {
          event.preventDefault();
        }
      });

      pet.addEventListener("auxclick", (event) => {
        if (event.button === 1) {
          event.preventDefault();
          window.desktopPet.openTodayWidget();
        }
      });
    </script>
  </body>
</html>
